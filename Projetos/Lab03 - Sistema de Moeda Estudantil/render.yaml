databases:
  - name: moeda-academica-db
    databaseName: moeda_academica
    user: moeda_academica_user
    plan: free
    region: oregon

services:
  - type: web
    name: moeda-academica
    runtime: python
    plan: free
    region: oregon
    branch: main   
    buildCommand: "./build.sh"
    startCommand: "gunicorn moeda_estudantil.wsgi:application"
    envVars:
      # 🔗 Banco de Dados
      - key: DATABASE_URL
        fromDatabase:
          name: moeda-academica-db
          property: connectionString

      # 🔐 Segurança
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"

      # 🐍 Versão do Python
      - key: PYTHON_VERSION
        value: "3.12.0"

      # 🌐 Hosts permitidos 
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1,.onrender.com"

      # ✉️ SMTP do Gmail
      - key: EMAIL_HOST_USER
        value: "moeda.academica@gmail.com"

      # ⚠️ Senha de app do Gmail 
      - key: EMAIL_HOST_PASSWORD
        sync: false
