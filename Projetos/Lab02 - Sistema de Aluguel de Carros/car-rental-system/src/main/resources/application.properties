# =========================
# H2 (persistente em arquivo)
# =========================
# Removido AUTO_SERVER e DB_CLOSE_ON_EXIT (incompatíveis com H2 2.x)
spring.datasource.url=jdbc:h2:file:~/autorentdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Dialect explícito é opcional em Boot 3 + H2 2.x; pode remover se quiser:
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console
spring.h2.console.enabled=false
spring.h2.console.path=/h2

# Server
server.port=8080

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=false

# Porta dinâmica do Render
server.port=${PORT:8080}

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

