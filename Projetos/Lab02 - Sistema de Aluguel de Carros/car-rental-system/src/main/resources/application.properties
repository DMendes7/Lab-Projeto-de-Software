# =========================
# Banco H2 em MEMÓRIA (reinicia a cada start)
# Ideal para Render quando você quer povoar via data.sql em todo deploy
# =========================
spring.datasource.url=jdbc:h2:mem:autorent;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
# 'update' cria/atualiza o schema antes do data.sql (com a flag abaixo)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Em Boot 3 + H2 2.x não é obrigatório setar o dialect

# H2 Console (desabilitado em produção; habilite localmente se precisar)
spring.h2.console.enabled=false
spring.h2.console.path=/h2

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=false

# Porta dinâmica do Render (NÃO deixar server.port fixo em 8080)
server.port=${PORT:8080}

# Rodar SEMPRE os scripts de inicialização (schema.sql / data.sql) após o JPA
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
