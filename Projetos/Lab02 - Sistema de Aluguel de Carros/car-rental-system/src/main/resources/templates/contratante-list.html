<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contratantes - AutoRent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link th:href="@{/css/style.css?v=3}" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <!-- Header -->
  <div th:replace="~{fragments/header :: header}"></div>

  <main class="container">
    <h1>Contratantes</h1>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <a th:href="@{/}" class="btn btn-secondary btn-sm"><i class="fas fa-arrow-left"></i> Voltar</a>
      <a th:href="@{/contratantes/novo}" class="btn btn-sm"><i class="fas fa-plus"></i> Novo Contratante</a>
    </div>

    <div class="table-container">
      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Documento</th>
            <th>E-mail</th>
            <th>Profissão</th>
            <th>RG</th>
            <th>Role</th>
            <th class="col-actions">Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="c : ${contratantes}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.nome}"></td>
            <td th:text="${c.documento}"></td>
            <td th:text="${c.email}"></td>
            <td th:text="${c.profissao}"></td>
            <td th:text="${c.rg}"></td>
            <td th:text="${c.role}"></td>
            <td>
              <div class="btn-group">
                <a th:href="@{/contratantes/editar/{id}(id=${c.id})}" class="btn btn-sm"><i class="fas fa-edit"></i> Editar</a>
                <a th:href="@{/contratantes/excluir/{id}(id=${c.id})}" class="btn btn-secondary btn-sm"
                   onclick="return confirm('Tem certeza que deseja excluir este contratante?')">
                  <i class="fas fa-trash"></i> Excluir
                </a>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer class="footer"><p>&copy; 2025 AutoRent.</p></footer>
</body>
</html>
