<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login - AutoRent</title>
  <link th:href="@{/css/style.css}" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

  <!-- inclui o header (sintaxe nova com ~{...}) -->
  <div th:replace="~{fragments/header :: header}"></div>

  <main class="container" style="max-width:420px;margin-top:30px">
    <h1 class="card-title">Entrar</h1>

    <div th:if="${param.error}" class="notification error" style="margin-top:8px">
      Usuário ou senha inválidos.
    </div>
    <div th:if="${param.logout}" class="notification success" style="margin-top:8px">
      Sessão encerrada com sucesso.
    </div>

    <!-- Spring Security usa 'username' e 'password' por padrão -->
    <form th:action="@{/login}" method="post" class="card" style="padding:20px">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="form-group">
        <label for="username">E-mail ou documento</label>
        <input id="username" name="username" type="text" class="form-control" required autofocus>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" class="form-control" required>
      </div>

      <div class="btn-group">
        <button class="btn" type="submit"><i class="fa fa-sign-in-alt"></i> Entrar</button>
      </div>
    </form>


</body>
</html>
